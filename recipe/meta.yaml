{% set name = "chainlit" %}
{% set version = "2.8.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 2a22f1ad24afd2625a70a18292991138428a9d9a2bc8b0509dc1e9eb96c663d0

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - chainlit = chainlit.cli:cli
  skip: true  # [py<310]

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - httpx >=0.23.0
    - literalai ==0.1.201
    - dataclasses-json >=0.6.7,<0.7.0
    - fastapi >=0.116.1,<0.117
    - starlette >=0.47.2
    - uvicorn >=0.35.0
    - python-socketio >=5.11.0,<6.0.0
    - aiofiles >=23.1.0,<25.0.0
    - syncer >=2.0.3,<3.0.0
    - asyncer >=0.0.8,<0.1.0
    - mcp >=1.11.0,<2.0.0
    - nest-asyncio >=1.6.0,<2.0.0
    - click >=8.1.3,<9.0.0
    - tomli >=2.0.1,<3.0.0
    - pydantic >=2.7.2,<3
    - python-dotenv >=1.0.0,<2.0.0
    - watchfiles >=0.20.0,<1.0.0
    - filetype >=1.2.0,<2.0.0
    - lazify >=0.4.0,<0.5.0
    - packaging >=23.1
    - python-multipart >=0.0.18,<1.0.0
    - pyjwt >=2.8.0,<3.0.0
    - audioop-lts >=0.2.1,<0.3.0  # [py>=313]
    - pydantic-settings >=2.10.1
  run_constrained:
    # mypy
    - mypy >=1.13,<2.0.0
    - types-requests >=2.31.0.2,<3.0.0
    - types-aiofiles >=23.1.0.5,<24.0.0
    - mypy-boto3-dynamodb >=1.34.113,<2.0.0
    - pandas-stubs >=2.2.2,<3.0.0  # [py>=39]
    # custom-data
    - asyncpg >=0.30.0,<1.0.0
    - sqlalchemy >=2.0.28,<3.0.0
    - boto3 >=1.34.73,<2.0.0
    - azure-identity >=1.14.1,<2.0.0
    - azure-storage-file-datalake >=12.14.0,<13.0.0
    - azure-storage-blob >=12.24.0,<13.0.0
    - google-cloud-storage >=2.19.0,<3.0.0

test:
  imports:
    - chainlit
  commands:
    - pip check
    - chainlit --help
  requires:
    - pip

about:
  home: https://github.com/Chainlit/chainlit
  summary: Build Conversational AI.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: Chainlit is an open-source Python package to build production ready Conversational AI.
  dev_url: https://github.com/Chainlit/chainlit
  doc_url: https://docs.chainlit.io/get-started/overview

extra:
  recipe-maintainers:
    - ianaobi
