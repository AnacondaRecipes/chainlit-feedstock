{% set name = "chainlit" %}
{% set version = "2.12.0" %}

# Tests are disabled, needs an authorization token.
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 53ca71c66fd98d417039ca5fa9c68349eb8eda771b7e0235a7da531f610fe5d0

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - chainlit = chainlit.cli:cli
  skip: true  # [py<310]

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - httpx >=0.23.0
    - literalai ==0.1.201
    - dataclasses-json >=0.6.7,<0.7.0
    - fastapi >=0.116.1
    - starlette >=0.47.2
    - uvicorn >=0.35.0
    - python-socketio >=5.11.0,<6.0.0
    - aiofiles >=23.1.0
    - syncer >=2.0.3,<3.0.0
    - asyncer >=0.0.8,<0.1.0
    - mcp >=1.28.1,<2.0.0
    - nest-asyncio >=1.6.0,<2.0.0
    - click >=8.1.3,<9.0.0
    - tomli >=2.0.1,<3.0.0
    - pydantic >=2.11.0,<3
    - python-dotenv >=1.0.0,<2.0.0
    - watchfiles >=1.1.1,<2.0.0
    - filetype >=1.2.0,<2.0.0
    - lazify >=0.4.0,<0.5.0
    - packaging >=23.1
    - python-multipart >=0.0.30,<1.0.0
    - pyjwt >=2.13.0,<3.0.0
    - pydantic-settings >=2.14.2
  run_constrained:
    # mypy
    - mypy >=1.13,<2.0.0
    - types-requests >=2.31.0.2,<3.0.0
    - types-aiofiles >=23.1.0.5,<26.0.0
    - mypy-boto3-dynamodb >=1.34.113,<2.0.0
    - pandas-stubs >=2.2.2,<4.0.0  # [py>=39]
    # custom-data
    - asyncpg >=0.30.0,<1.0.0
    - sqlalchemy >=2.0.28,<3.0.0
    - boto3 >=1.34.73,<2.0.0
    - azure-identity >=1.14.1,<2.0.0
    - azure-storage-file-datalake >=12.14.0,<13.0.0
    - azure-storage-blob >=12.24.0,<13.0.0
    - google-cloud-storage >=2.19.0,<4.0.0

test:
  imports:
    - chainlit
    - chainlit.action
    - chainlit.auth
    - chainlit.auth.cookie
    - chainlit.cache
    - chainlit.chat_context
    - chainlit.chat_settings
    - chainlit.cli
    - chainlit.config
    - chainlit.context
    - chainlit.data
    - chainlit.data.acl
    - chainlit.data.base
    - chainlit.data.storage_clients.base
    - chainlit.data.utils
    - chainlit.element
    - chainlit.emitter
    - chainlit.input_widget
    - chainlit.logger
    - chainlit.markdown
    - chainlit.mcp
    - chainlit.message
    - chainlit.oauth_providers
    - chainlit.secret
    - chainlit.server
    - chainlit.session
    - chainlit.sidebar
    - chainlit.socket
    - chainlit.step
    - chainlit.sync
    - chainlit.translations
    - chainlit.types
    - chainlit.user
    - chainlit.user_session
    - chainlit.utils
    - chainlit.version
  commands:
    - pip check
    - chainlit --help
  requires:
    - pip

about:
  home: https://chainlit.io
  summary: Build Conversational AI.
  description: Chainlit is an open-source Python package to build production ready Conversational AI.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  dev_url: https://github.com/Chainlit/chainlit
  doc_url: https://docs.chainlit.io

extra:
  recipe-maintainers:
    - ianaobi
